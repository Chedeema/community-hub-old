<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Education Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--sf:#fff;--ink:#14262b;--mut:#5a6e72;--ln:#d3dedc;--ac:#0f766e;--acx:#fff;--sg:#e8b100;--bad:#b42318;--ok:#18794e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--sf:#16272b;--ink:#e8f1f0;--mut:#9bb0b3;--ln:#2a3f44;--ac:#3fc1b3;--acx:#06201d;--sg:#f0c53a;--bad:#ff8a7a;--ok:#5dd39e}}
:root[data-theme="dark"]{--bg:#0e1a1d;--sf:#16272b;--ink:#e8f1f0;--mut:#9bb0b3;--ln:#2a3f44;--ac:#3fc1b3;--acx:#06201d;--sg:#f0c53a;--bad:#ff8a7a;--ok:#5dd39e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Atkinson Hyperlegible',Verdana,Arial,sans-serif}
header{padding:20px 20px 0;max-width:1000px;margin:auto}
h1{font-size:1.6rem;margin:0 0 2px;letter-spacing:-.01em}h2{font-size:1.25rem;margin:0 0 6px}h3{font-size:1rem;margin:14px 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 12px;max-width:1000px;margin:auto}
nav button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-current=true]{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
main{max-width:1000px;margin:auto;padding:0 20px 60px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 150px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button.b{background:var(--ac);color:var(--acx);border:0;padding:9px 16px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--ln);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sg);outline-offset:1px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;border:1px solid var(--ln);color:var(--mut)}
.on{color:var(--ok);border-color:var(--ok)}.off{color:var(--bad);border-color:var(--bad)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);flex-wrap:wrap}.item:first-child{border-top:0}
.bar{height:12px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar i.low{background:var(--bad)}
.stat{font-size:1.9rem;font-weight:700;line-height:1.1}
.alert{border-left:6px solid var(--sg);background:var(--sf);padding:12px 14px;border-radius:6px;margin-bottom:14px;border:1px solid var(--ln);border-left-width:6px}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:12px;border-radius:8px;border:1px solid var(--ln)}
.cert{border:4px double var(--ac);padding:26px;text-align:center;border-radius:6px}
.mut{color:var(--mut)}
@media print{nav,header,.noprint{display:none}body{background:#fff;color:#000}}
:root[data-theme=dark]{--bg:#0a0f1e;--sf:#121a33;--ink:#eaf0ff;--mut:#9aa7cc;--ln:#27325f;--ac:#5eead4;--ac2:#38bdf8;--acx:#04201c;--sg:#fbbf24;--bad:#ff7a90;--ok:#4ade80;--g1:rgba(139,92,246,.28);--g2:rgba(94,234,212,.16);--sh:0 8px 30px rgba(0,0,0,.35)}
:root[data-theme=light]{--bg:#f3f5ff;--sf:#fff;--ink:#111936;--mut:#59638c;--ln:#dce1f4;--ac:#4f46e5;--ac2:#7c3aed;--acx:#fff;--sg:#b97800;--bad:#c9254a;--ok:#12805c;--g1:rgba(124,58,237,.14);--g2:rgba(79,70,229,.08);--sh:0 8px 24px rgba(40,50,120,.10)}
body{font-size:17px;background:radial-gradient(800px 480px at 90% -8%,var(--g1),transparent 70%),radial-gradient(700px 420px at -8% 4%,var(--g2),transparent 70%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px}header .t{flex:1 1 240px}
h1{font-size:clamp(1.5rem,4vw,2.1rem)}.sub{margin:0}
.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 0 26px var(--g1)}
.pill{padding:5px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-size:.85rem;color:var(--ok);font-weight:700}
nav{padding-bottom:16px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 0 108px;padding:12px 10px;border-radius:16px;font-size:.95rem;transition:transform .15s,box-shadow .15s}
nav .ic{font-size:1.7rem;line-height:1.2}nav button:hover{transform:translateY(-3px);box-shadow:var(--sh)}nav button:active{transform:scale(.96)}
nav button[aria-current=true]{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acx);border-color:transparent;box-shadow:0 6px 24px var(--g1)}
.tip{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;margin-bottom:16px;border:1px solid var(--ln);background:linear-gradient(120deg,var(--g1),var(--g2))}.tip .em{font-size:2rem}
.card{border-radius:18px;box-shadow:var(--sh);transition:border-color .2s,transform .2s}.card:hover{border-color:var(--ac)}
.stat{color:var(--ac);font-size:2.2rem}
input,select,textarea{min-height:46px;border-radius:12px;font-size:1rem;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--g2)}
input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--ac);margin-right:8px;vertical-align:middle}
button.b{min-height:46px;padding:10px 20px;border-radius:12px;font-size:1rem;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 16px var(--g1);transition:transform .12s,filter .12s}
button.b:hover{filter:brightness(1.1);transform:translateY(-1px)}button.b:active,button.g:active{transform:scale(.95)}
button.g{min-height:40px;border-radius:12px;transition:border-color .15s,color .15s,transform .12s}button.g:hover{border-color:var(--ac);color:var(--ac)}
.tag{padding:3px 11px;font-weight:700}.tag.on{background:rgba(74,222,128,.12)}.tag.off{background:rgba(255,122,144,.12)}
.bar{height:14px;border-radius:99px}.bar i{background:linear-gradient(90deg,var(--ac),var(--ac2));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1)}.bar i.low{background:var(--bad)}@keyframes grow{from{transform:scaleX(0)}}
.alert{border-radius:14px;box-shadow:var(--sh)}pre{border-radius:14px;line-height:1.7}
.cert{border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2))}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--sf);color:var(--ink);border:1px solid var(--ac);padding:12px 20px;border-radius:99px;box-shadow:var(--sh);font-weight:700;transition:all .25s;z-index:100;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:99;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{:root[data-theme]{--sf:#fff;--ink:#000;--bg:#fff;--mut:#444;--ln:#999;--g1:#fff;--g2:#fff}body{background:#fff!important}.tip,#toast{display:none}.card{box-shadow:none}}
svg.i{flex:none;display:block}nav .ic{display:flex}.logo svg{color:var(--acx)}.tip .em{display:flex;color:var(--ac)}button.g{display:inline-flex;align-items:center;gap:8px}
#toast{display:flex;align-items:center;gap:10px}#toast svg{color:var(--ac)}
.chat{min-height:150px;max-height:440px;overflow:auto;margin:12px 0;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{padding:10px 14px;border-radius:16px;max-width:92%;border:1px solid var(--ln);line-height:1.6}.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--g1),var(--g2))}.msg.assistant{align-self:flex-start;background:var(--bg)}.msg b.w{display:block;font-size:.8rem;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:none}
.crs{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;flex:1 1 180px;transition:transform .12s,border-color .15s}.crs:hover{transform:translateY(-2px)}.crs[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--g1)}.crs svg{color:var(--ac)}
button.g[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.cert2{background:#fffdf8;color:#1b2440;padding:12px;border-radius:6px;font-family:'Cormorant Garamond',Georgia,serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert2 .in{border:3px solid #1b2440;outline:1px solid #b8892b;outline-offset:-9px;padding:34px 26px;text-align:center;background:radial-gradient(circle at 50% 0,#f7ecd0,transparent 60%),#fffdf8}
.cert2 .brand{display:flex;justify-content:center;align-items:center;gap:10px;font:700 .9rem 'Atkinson Hyperlegible',sans-serif;letter-spacing:.25em}.cert2 .brand svg{color:#b8892b}
.cert2 .ct{font-size:clamp(2.2rem,8vw,4rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:1.1;margin-top:14px}
.cert2 .cs{font-size:1.25rem;letter-spacing:.35em;text-transform:uppercase;color:#b8892b;font-weight:700}
.cert2 .pr{font-size:1.2rem;font-style:italic;margin:14px 0 4px;color:#4a5170}
.cert2 .nm{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(2.4rem,9vw,4rem);border-bottom:2px solid #b8892b;display:inline-block;padding:0 26px;line-height:1.35}
.cert2 .dt{font-size:1.1rem;margin:6px 0}.cert2 .cn{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700;color:#0f766e}
.cert2 .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;text-align:center;flex-wrap:wrap}.cert2 .ft>div{flex:1 1 120px;display:flex;flex-direction:column;font-size:.95rem}.cert2 .ft b{font-size:1.05rem}.cert2 .ft span{color:#4a5170;letter-spacing:.1em;text-transform:uppercase;font-size:.68rem;font-family:'Atkinson Hyperlegible',sans-serif}
.cert2 .ft>.seal{flex:0 0 86px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,#ecc95f,#b8892b);color:#fff;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fffdf8,0 0 0 6px #b8892b}
.cert2 .sg{margin-top:20px;font-size:.9rem;color:#4a5170}.cert2 .sg i{display:block;width:230px;max-width:70%;border-top:1px solid #1b2440;margin:0 auto 4px}
@media print{@page{size:landscape;margin:8mm}body.pc main>*:not(.certwrap),body.pc .tip{display:none}}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">📚</div><div class="t"><h1>Community Education Hub</h1><p class="sub" id="greet"></p></div><span class="pill">● Works offline</span><button class="g" onclick="theme()" aria-label="Switch between light and dark">◐ Light / Dark</button></header>
<nav id="nav" aria-label="Sections"></nav>
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const TABS=[["learn","My Learning"],["box","Learning Box"],["tool","Teacher Toolkit"],["net","Continuity Network"],["dash","Dashboard"],["train","Digital Skills"],["ask","Ask AI"]];
const IC=["📦","🧰","🌐","📊","🎓"];
const TIPS={box:"<b>Your offline library.</b> Tap <b>Load</b> on a resource to put it on the box. Learners can then open it with no internet.",tool:"<b>Three helpers in one place.</b> Build a lesson in seconds, write a quiz, then record scores to see who needs extra help.",net:"<b>Be ready for disruptions.</b> Add your hubs, then tap <b>Activate continuity mode</b> to see the backup plan.",dash:"<b>Your school at a glance.</b> Everything you record in the other tabs appears here automatically.",train:"<b>Learn at your own pace.</b> Choose AI, Word, Excel or PowerPoint, read each short lesson, answer one question and earn a certificate.",learn:"<b>Your classroom in one place.</b> See today’s lessons, notices from your teacher, your scores and the resources shared with you.",ask:"<b>Stuck? Just ask.</b> Teachers and students can type a question or tap a quick help button to get a clear answer in seconds."};
const MODS=[
["What AI is and isn’t","AI tools predict likely text. They can sound confident and still be wrong.","An AI tool gives you a lesson fact. What should you do first?",["Share it with learners","Check it against a trusted source","Ignore AI completely"],1],
["Writing good prompts","Give the grade, topic, time and available materials. Clear context gives more useful drafts.","Which prompt is strongest?",["Make a lesson","Grade 5 fractions, 40 minutes, no projector, mixed ability","Fractions"],1],
["Privacy and safe use","Never enter learners’ names, photos or personal details into AI tools.","What can you safely paste into an AI tool?",["A learner’s full name and marks","A class list","A generic topic and grade level"],2],
["AI in assessment","Use AI to draft questions, then review them for accuracy, fairness and curriculum fit.","Who is responsible for the final assessment?",["The AI tool","The teacher","Nobody"],1],
["Styles and headings","Use Heading 1, Heading 2 and Normal from the Home tab instead of making text big and bold by hand. Styles keep documents consistent and let Word build a table of contents for you.","Why use the built-in Heading styles?",["They look nicer than bold text","They keep formatting consistent and enable a table of contents","They make the file smaller"],1,"word"],
["Tables and lists","Use Insert > Table for data in rows and columns. Use bullets or numbering for lists. Never line text up by pressing the space bar.","What is the best way to line up columns of text?",["Press the space bar many times","Use a table or tab stops","Use different font sizes"],1,"word"],
["Track changes and mail merge","Use Review > Track Changes when a colleague edits your document. Use Mailings > Start Mail Merge to produce personalised letters, such as report cards.","Which feature shows who changed what in a shared document?",["Track Changes","Word Count","Page Break"],0,"word"],
["Cells, rows and columns","Each box is a cell, named by its column letter and row number, such as B3. Type data in rows with one heading for each column.","What is the cell in column C, row 5 called?",["5C","C5","CC5"],1,"excel"],
["Formulas and SUM","Every formula starts with =. =SUM(B2:B10) adds a range and =AVERAGE(B2:B10) finds the mean. Use them for class totals and averages.","Which formula adds the numbers in B2 to B10?",["=SUM(B2:B10)","SUM B2-B10","=ADD(B2,B10)"],0,"excel"],
["Sorting and filtering","Select your headings and choose Data > Filter to show only some rows, such as learners below 50. Data > Sort puts names or scores in order.","How can you show only learners who scored below 50?",["Delete the other rows","Use Data > Filter","Change the font colour"],1,"excel"],
["Charts and IF","Select your data and choose Insert > Chart to make a graph. A formula like =IF(B2<50,\"Support\",\"OK\") labels each learner automatically.","What does =IF(B2<50,\"Support\",\"OK\") show when B2 is 42?",["OK","Support","An error"],1,"excel"],
["Slides and layouts","Pick a layout from Home > Layout. Keep one idea on each slide with large text and few words. Put the detail in your speaker notes.","What is good practice for slide text?",["Fill the slide with small text","One idea per slide with few words","Use many different fonts"],1,"ppt"],
["Themes and pictures","Use Design > Themes for a consistent look. Add pictures with Insert > Pictures and keep strong contrast between text and background.","Why choose one theme for the whole deck?",["It keeps the look consistent","It adds animation","It saves your file"],0,"ppt"],
["Presenting well","Press F5 to start the slideshow and Esc to leave it. Use Presenter View to see your notes and Rehearse Timings to practise.","Which key starts the slideshow?",["F5","F1","Tab"],0,"ppt"]];
const SEED={tab:"box",boxName:"Box 01",res:[
{t:"Grade 4 Fractions Pack",s:"Maths",g:"4",ty:"PDF",mb:12,y:1},{t:"The Water Cycle (video)",s:"Science",g:"5",ty:"Video",mb:180,y:1},
{t:"Level 2 Story Readers",s:"English",g:"2",ty:"eBook",mb:30,y:0},{t:"Teacher Guide: Mixed-ability Classes",s:"Pedagogy",g:"All",ty:"PDF",mb:6,y:1}],
hubs:[{n:"Central Community Hall",ch:["Hub","Printed packs"],on:1},{n:"St. Mary’s Primary",ch:["Offline devices","Radio"],on:1},{n:"Riverside Learning Centre",ch:["SMS","Printed packs"],on:1}],
disrupt:0,scores:[],plans:0,tr:{},name:""};
let S;try{S=Object.assign({},SEED,JSON.parse(localStorage.getItem("ceh")||"{}"))}catch(e){S=JSON.parse(JSON.stringify(SEED))}
const save=()=>{try{localStorage.setItem("ceh",JSON.stringify(S))}catch(e){}};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);const v=id=>$(id).value.trim();
let AS=[],PLAN="",rf={s:"All"};
function go(t){S.tab=t;save();draw();scrollTo(0,0)}
function draw(){
const h=new Date().getHours();$("greet").textContent=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+", teacher. Pick a tool to get started.";
$("nav").innerHTML=TABS.map(([k,n],i)=>`<button aria-current="${S.tab==k}" onclick="go('${k}')"><span class="ic">${IC[i]}</span>${n}</button>`).join("");
$("app").innerHTML=`<div class="tip"><span class="em">${IC[TABS.findIndex(t=>t[0]==S.tab)]}</span><div>${TIPS[S.tab]}</div></div>`+({box,tool,net,dash,train})[S.tab]()}

/* 1 Learning Box */
function box(){const used=S.res.filter(r=>r.y).reduce((a,r)=>a+r.mb,0),cap=1000,subs=["All",...new Set(S.res.map(r=>r.s))];
const list=S.res.map((r,i)=>({r,i})).filter(o=>rf.s=="All"||o.r.s==rf.s);
return `<div class="card"><h2>Community Learning Box</h2><p class="mut">Choose what is loaded onto the portable server. Learners connect to the box’s local Wi-Fi and open resources with no internet.</p>
<div class="row"><div><label>Box name</label><input id="bn" value="${E(S.boxName)}" onchange="S.boxName=this.value;save()"></div>
<div><label>Storage used (1 GB demo box)</label><div class="stat">${used} MB</div><div class="bar"><i style="width:${Math.min(100,used/cap*100)}%"></i></div></div></div>
<p class="mut">Learners join Wi-Fi “${E(S.boxName)}” and open <b>learn.box</b> in a browser.</p></div>
<div class="card"><h3>Resource library</h3><label for="rfs">Filter by subject</label><select id="rfs" onchange="rf.s=this.value;draw()">${subs.map(s=>`<option ${s==rf.s?"selected":""}>${E(s)}</option>`).join("")}</select>
${list.map(({r,i})=>`<div class="item"><div><b>${E(r.t)}</b><br><span class="mut">${E(r.s)} · Grade ${E(r.g)} · ${E(r.ty)} · ${r.mb} MB</span></div>
<div><span class="tag ${r.y?"on":"off"}">${r.y?"On the box":"Not loaded"}</span> <button class="g" onclick="S.res[${i}].y^=1;save();draw()">${r.y?"Remove":"Load"}</button></div></div>`).join("")||'<p class="mut">No resources for this subject.</p>'}</div>
<div class="card"><h3>Add a resource</h3><div class="row"><div><label>Title</label><input id="rt"></div><div><label>Subject</label><input id="rs"></div><div><label>Grade</label><input id="rg"></div>
<div><label>Type</label><select id="ry"><option>PDF</option><option>Video</option><option>eBook</option><option>Audio</option><option>Worksheet</option></select></div><div><label>Size (MB)</label><input id="rm" type="number" min="1" value="10"></div></div>
<p><button class="b" onclick="addRes()">Add to library</button></p></div>`}
function addRes(){if(!v("rt")||!v("rs"))return alert("Enter a title and subject.");S.res.push({t:v("rt"),s:v("rs"),g:v("rg")||"All",ty:v("ry"),mb:+v("rm")||1,y:1});save();draw()}

/* 2 Toolkit */
function tool(){return `<div class="card"><h2>Lesson plan builder</h2><p class="mut">Builds a structured draft you can edit. Works fully offline.</p>
<div class="row"><div><label>Subject</label><input id="ls" placeholder="Maths"></div><div><label>Grade</label><input id="lg" placeholder="5"></div><div><label>Topic</label><input id="lt" placeholder="Equivalent fractions"></div>
<div><label>Minutes</label><input id="lm" type="number" value="40"></div><div><label>Resources</label><select id="lr"><option value="0">Board and chalk only</option><option value="1">Printed worksheets</option><option value="2">Tablet or box devices</option></select></div></div>
<p><button class="b" onclick="mkPlan()">Build lesson plan</button> ${PLAN?`<button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText(PLAN)">Copy</button> <button class="g" onclick="print()">Print</button>`:""}</p>${PLAN?`<label for="plan">Edit your plan here</label><textarea id="plan" rows="22" oninput="PLAN=this.value" style="line-height:1.6">${E(PLAN)}</textarea><p><button class="b" onclick="savePlan()">Save to my plans</button></p>`:""}${savedPlans()}</div>
<div class="card"><h2>Assessment builder</h2><div class="row"><div><label>Topic</label><input id="at" placeholder="Equivalent fractions"></div><div><label>Question</label><input id="aq"></div>
<div><label>Format</label><select id="af"><option>Short answer</option><option>Multiple choice</option><option>Problem solving</option></select></div><div><label>Marks</label><input id="am" type="number" value="2"></div></div>
<p><button class="b" onclick="addQ()">Add question</button> ${AS.length?`<button class="g" onclick="AS=[];draw()">Clear</button> <button class="g" onclick="print()">Print</button>`:""}</p>

function mkPlan(){const s=v("ls"),g=v("lg"),t=v("lt"),m=+v("lm")||40;if(!s||!t)return alert("Enter a subject and topic.");const r=v("lr");

function enter(r){const g=k=>$(r+k).value.trim(),name=g("n"),email=g("e").toLowerCase();if(name.split(/\s+/).length<2)return toast("Enter your full name (first and last name).",1);if(!/^\S+@\S+\.\S+$/.test(email))return toast("Enter a valid email address.",1);mk(r,name,email,g("s"))}
function mk(r,name,email,school){let u=S.users.find(x=>x.email==email&&x.role==r);if(!u){u={id:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),role:r,name,email,pw:"",school:school||"",x:"",phone:"",tr:{}};S.users.push(u)}else{u.name=name;if(school)u.school=school}useUser(u.id,1)}
function useUser(id,fresh){const u=S.users.find(x=>x.id==id);if(!u)return;S.cur=id;S.tr=u.tr;(S.last=S.last||{})[u.role]=id;S.tab=u.role=="teacher"?"box":"learn";save();draw();scrollTo(0,0);toast((fresh?"Welcome, ":"Welcome back, ")+u.name.split(" ")[0])}
function demo(r){mk(r,r=="teacher"?"Demo Teacher":"Demo Student",r+"@demo.example","Demo School")}
function swRole(){const u=U();if(!u)return;const r=u.role=="teacher"?"student":"teacher",id=(S.last||{})[r];if(id&&S.users.some(x=>x.id==id))useUser(id);else{S.cur=null;S.tr={};save();draw()}}
function peopleCard(){const L=S.users;return `<div class="card noprint"><h2>People using this prototype</h2><p class="mut">Names and emails collected from teachers and students on this device.</p>${L.length?L.map(x=>`<div class="item"><div><b>${E(x.name)}</b> <span class="tag">${x.role=="teacher"?"Teacher":"Student"}</span><br><a href="mailto:${E(x.email)}" style="color:var(--ac)">${E(x.email)}</a>${x.school?" \u00b7 "+E(x.school):""}</div></div>`).join(""):'<p class="mut">No one has entered their details yet.</p>'}${L.length?`<p><button class="g" onclick="expoCsv()">${ic("download",18)} Download list (CSV)</button></p>`:""}</div>`}
async function expoCsv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[["Name","Email","Role","School"],...S.users.map(u=>[u.name,u.email,u.role,u.school||""])].map(r=>r.map(q).join(",")).join("\n");try{const d=await claude.use("downloads");if(!d)return toast("Saving files is not available here.",1);await d.save({filename:"people.csv",data:new Blob([rows],{type:"text/csv"})});toast("List ready")}catch(e){if(!e||e.code!="declined")toast("The file was not saved.",1)}}
draw();
</script>
</body>
</html>
